name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=a855f7
        env:
          # This gives the action authorized API access to prevent the 429 scraping error
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}